<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="../assets/no-ajax.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>الجداول الدراسية | لوحة تحكم مركز التعلم المستمر</title>
    <link rel="icon" href="../assets/ba5c2cc1-5c62-4b77-8607-bead454d224e.png" type="image/png">
    <link rel="stylesheet" href="../assets/vendor/fonts/google-fonts-local.css">
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body class="admin-dashboard-body"
    data-admin-layout="app"
    data-admin-sidebar-active="schedules.html"
    data-admin-breadcrumb='[{"href":"index.html","label":"الرئيسية"},{"label":"الجداول الدراسية"}]'>

    <div class="admin-app admin-app--dashboard">
        <aside class="admin-sidebar" aria-label="القائمة الجانبية">
            <div class="admin-sidebar__brand">
                <a href="index.html" class="admin-sidebar__logo-link">
                    <img src="../assets/ba5c2cc1-5c62-4b77-8607-bead454d224e.png" alt="مركز التعلم المستمر — معهد البحوث بجامعة الامير مقرن">
                </a>
                <p class="admin-sidebar__org">مركز التعلم المستمر</p>
                <p class="admin-sidebar__org-sub">معهد البحوث والدراسات الاستشارية — جامعة الامير مقرن</p>
            </div>
            <div class="admin-sidebar__scroll">
                <ul class="admin-side-nav"></ul>
            </div>
            <div class="admin-sidebar__foot">
                <a href="../index.html">← الموقع العام</a>
            </div>
        </aside>

        <div class="admin-main">
            <header class="admin-header admin-header--app">
                <button type="button" class="admin-sidebar-toggle" id="admin-sidebar-toggle" aria-label="فتح القائمة">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <nav class="admin-breadcrumb" id="admin-breadcrumb" aria-label="مسار التنقل"></nav>
                <div class="admin-header__tools">
                    <form class="admin-search" role="search" onsubmit="return false;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                        <input type="search" placeholder="بحث..." aria-label="بحث">
                    </form>
                    <div class="admin-user-pill">
                        <div class="admin-avatar" id="admin-avatar">م</div>
                        <span id="admin-user-name">مسؤول المنصة</span>
                    </div>
                    <button type="button" class="admin-btn-outline" id="admin-logout">خروج</button>
                </div>
            </header>

            <div class="admin-content admin-content--app">
                <section class="admin-crud-card admin-crud-card--filter">
                    <div class="admin-crud-card__head">
                        <h2>اختر الفصل ثم الدفعة ثم المستوى ثم الفترة</h2>
                    </div>
                    <form id="schedules-filter-form" class="admin-filter-grid admin-filter-grid--schedules">
                        <div class="admin-field">
                            <label for="f-sched-semester">الفصل الدراسي (المقبول)</label>
                            <select class="admin-control" id="f-sched-semester" name="semester" required></select>
                        </div>
                        <div class="admin-field">
                            <label for="f-sched-batch">الدفعة</label>
                            <select class="admin-control" id="f-sched-batch" name="batch" required></select>
                        </div>
                        <div class="admin-field">
                            <label for="f-sched-level">المستوى</label>
                            <select class="admin-control" id="f-sched-level" name="level" required></select>
                        </div>
                        <div class="admin-field">
                            <label for="f-sched-period">الفترة</label>
                            <select class="admin-control" id="f-sched-period" name="period" required></select>
                        </div>
                        <div class="admin-filter-actions admin-filter-actions--schedules">
                            <button type="button" class="admin-btn-primary admin-btn-primary--sm" id="schedules-save-btn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" aria-hidden="true"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
                                حفظ جدول الشعب
                            </button>
                        </div>
                    </form>
                </section>

                <section class="admin-crud-card" id="schedules-table-card" hidden>
                    <div class="admin-crud-card__head">
                        <h2 id="schedules-table-title">جداول الشعب (0)</h2>
                    </div>
                    <div class="admin-table-wrap">
                        <table class="admin-data-table admin-data-table--schedules" id="schedules-table">
                            <thead>
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">الشعبة</th>
                                    <th scope="col">المقرر</th>
                                    <th scope="col">المدرب</th>
                                    <th scope="col">اليوم</th>
                                    <th scope="col">الوقت</th>
                                </tr>
                            </thead>
                            <tbody id="schedules-tbody"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="./js/admin-auth.js"></script>
    <script src="./js/admin-schedules-data.js"></script>
    <script src="./js/admin-shell.js"></script>
    <script></script>
    <script src="./js/admin-schedules.js"></script>
    <script></script>
</body>
</html>
