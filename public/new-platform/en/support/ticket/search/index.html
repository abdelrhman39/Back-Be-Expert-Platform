<body class="portal-body d-flex flex-column min-vh-100 bg-white">
    <header class="portal-header">
        <div class="portal-header__inner">

                <a href="../new/index.html">Open a ticket</a>

            </nav>
            <div class="portal-actions align-items-center gap-2">

                <div class="col-md-6 order-1">
                    <div class="bg-white p-4 p-md-5 rounded-3 shadow-sm border h-100">
                        <form action="#" method="get" novalidate>
                            <div class="mb-4">
                                <label class="form-label" for="ticket-id">Ticket number <span class="text-danger">*</span></label>
                                <input type="text" class="form-control form-control-lg" id="ticket-id" name="ticket" required placeholder="Enter ticket number">
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="ticket-email">Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control form-control-lg" id="ticket-email" name="email" required placeholder="Enter your email">
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">Search</button>
                        </form>
                    </div>
                </div>
                <div class="col-md-6 order-2">
                    <aside class="portal-aside-card h-100 d-flex flex-column justify-content-center text-center">
                        <div class="fs-1 mb-2" aria-hidden="true">🔐</div>
                        <h2 class="mb-2">Track your ticket</h2>
                        <p class="mb-0 text-muted">Enter your ticket number and email to find your request and its status.</p>
                    </aside>
                </div>
